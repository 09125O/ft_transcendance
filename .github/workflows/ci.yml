name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - "issue_*/**"
      - "feature/*"
      - "fix/*"
      - "chore/*"

permissions:
  contents: read

jobs:
  lint:
    name: Lint ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            node_version: 22
          - app: frontend
            node_version: 20

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}

      - name: Validate lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Missing package-lock.json in ${{ matrix.app }}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint application
        run: npm run lint

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: bash scripts/test/lint-shell.sh

  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs:
      - lint
      - shellcheck
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            node_version: 22
          - app: frontend
            node_version: 20

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}

      - name: Validate lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Missing package-lock.json in ${{ matrix.app }}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    needs:
      - lint
      - shellcheck
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run unit tests
        run: npm run test -- --runInBand
