services:
  frontend:
    image: frontend_img
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quiz_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - ./.local/certs:/certs:ro
      - /app/node_modules
    env_file:
      - .env
    environment:
      BACKEND_HOST: backend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const protocol = process.env.APP_PROTOCOL === 'https' || (process.env.FRONTEND_ORIGIN || '').startsWith('https://') ? 'https' : 'http'; const transport = require(protocol); const target = protocol + '://127.0.0.1:3000'; const onResponse = (response) => process.exit(response.statusCode && response.statusCode < 500 ? 0 : 1); const req = protocol === 'https' ? transport.request(target, { rejectUnauthorized: false }, onResponse) : transport.request(target, onResponse); req.on('error', () => process.exit(1)); req.end();",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend:
    image: backend_img
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz_backend
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - ./.local/certs:/certs:ro
      - ./.local/backend-runtime:/runtime
      - /app/node_modules
    env_file:
      - .env
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      BACKUP_STATUS_FILE: /runtime/backup-status.json
      BACKEND_RUNTIME_DIR: /runtime
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const protocol = process.env.APP_PROTOCOL === 'https' || (process.env.FRONTEND_ORIGIN || '').startsWith('https://') ? 'https' : 'http'; const transport = require(protocol); const target = protocol + '://127.0.0.1:4000/health'; const onResponse = (response) => process.exit(response.statusCode === 200 ? 0 : 1); const req = protocol === 'https' ? transport.request(target, { rejectUnauthorized: false }, onResponse) : transport.request(target, onResponse); req.on('error', () => process.exit(1)); req.end();",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backup:
    image: db_img
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: quiz_db_backup
    entrypoint: ["/bin/sh", "/scripts/ops/auto-backup.sh"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      BACKUP_DIR: /backups
      BACKUP_STATUS_FILE: /runtime/backup-status.json
    volumes:
      - ./.local/backups:/backups
      - ./.local/backend-runtime:/runtime
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /runtime/backup-status.json && grep -q '\"ok\": true' /runtime/backup-status.json",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  db:
    image: db_img
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: quiz_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
    name: postgres_volume

networks:
  default:
    name: quiz_network
